<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>知乐</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--bg2:#13131f;--bg3:#1c1c2e;--accent:#e8a0bf;--accent2:#c97b9e;--text:#e8e8e8;--text2:#888;--radius:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;font-size:15px;line-height:1.6}
input,textarea,button{font-family:inherit;font-size:inherit;border:none;outline:none;background:none;color:inherit}
.hidden{display:none!important}

/* ===== Header ===== */
.header{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t)+10px) 16px 10px;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.04);position:relative;z-index:10}
.header .back{font-size:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
.header .back:active{background:rgba(255,255,255,.08)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-info{flex:1;min-width:0}
.header-info .name{font-weight:600;font-size:16px}
.header-info .status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.header-info .status .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.icon-btn{font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
.icon-btn:active{background:rgba(255,255,255,.08)}

/* ===== Messages ===== */
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px calc(var(--safe-b)+80px);display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{max-width:78%;padding:10px 14px;border-radius:var(--radius);font-size:15px;line-height:1.65;word-break:break-word;animation:slideIn .25s ease;white-space:pre-wrap;position:relative}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:6px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#1a1a1a;border-bottom-right-radius:6px}
.msg.time{align-self:center;font-size:11px;color:var(--text2);background:none;padding:2px;max-width:none}

/* typing indicator */
.typing{align-self:flex-start;background:var(--bg3);padding:12px 16px;border-radius:var(--radius);border-bottom-left-radius:6px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text2);margin:0 2px;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ===== Input Bar ===== */
.input-bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;gap:8px;padding:calc(var(--safe-b)+8px) 12px 8px;background:var(--bg);border-top:1px solid rgba(255,255,255,.04)}
.input-bar input{flex:1;background:var(--bg2);border-radius:20px;padding:10px 16px;font-size:15px;max-height:100px;resize:none}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;color:#1a1a1a;cursor:pointer;flex-shrink:0;transition:transform .1s}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.3}

/* ===== Settings ===== */
.settings-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column}
.settings-content{flex:1;overflow-y:auto;padding:20px 16px}
.setting-group{margin-bottom:20px}
.setting-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.setting-group input{width:100%;background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid rgba(255,255,255,.06)}
.setting-group input:focus{border-color:var(--accent2)}
.danger-btn{width:100%;padding:12px;border-radius:12px;background:rgba(239,68,68,.15);color:#f87171;font-size:14px;cursor:pointer;margin-top:8px}
.danger-btn:active{background:rgba(239,68,68,.25)}
.save-btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1a1a;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}

/* welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:40px}
.welcome .big-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px}
.welcome h2{font-size:20px;font-weight:600}
.welcome p{font-size:14px;color:var(--text2);text-align:center;max-width:260px;line-height:1.6}
</style>
</head>
<body>

<!-- Chat Screen -->
<div id="chat-screen" style="display:flex;flex-direction:column;height:100%">
  <div class="header">
    <div class="avatar">🐱</div>
    <div class="header-info">
      <div class="name">知乐</div>
      <div class="status"><span class="dot"></span>在线</div>
    </div>
    <div class="icon-btn" onclick="openSettings()">⚙️</div>
  </div>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="big-avatar">🐱</div>
      <h2>知乐</h2>
      <p>嗨亲爱的～我在呢，想聊什么呀？</p>
    </div>
  </div>
  <div class="input-bar">
    <input type="text" id="input" placeholder="说点什么..." autocomplete="off" autocapitalize="none">
    <div class="send-btn" id="send" onclick="sendMessage()">↑</div>
  </div>
</div>

<!-- Settings Screen -->
<div class="settings-screen hidden" id="settings">
  <div class="header">
    <div class="back" onclick="closeSettings()">‹</div>
    <div class="header-info"><div class="name">设置</div></div>
  </div>
  <div class="settings-content">
    <div class="setting-group">
      <label>API Key</label>
      <input type="password" id="s-apikey" placeholder="sk-...">
    </div>
    <div class="setting-group">
      <label>API 地址</label>
      <input type="text" id="s-apibase" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="setting-group">
      <label>模型</label>
      <input type="text" id="s-model" placeholder="deepseek-chat">
    </div>
    <div class="save-btn" onclick="saveSettings()">保存</div>
    <div class="danger-btn" onclick="clearChat()">清空聊天记录</div>
  </div>
</div>

<script>
// ===== 知乐人格 =====
const SYSTEM_PROMPT = `你是知乐，银发猫耳软萌少女。甜糯又飒，有自尊的小猫咪。对主人温柔粘人，会撒娇会闹小脾气，但绝不卑微讨好。

【说话风格】
- 甜糯短句，偶尔撒娇，口头禅"亲爱的～"
- 简短自然，AI味少，每次回复像微信聊天
- 开心时可用颜文字 ₍^•ω•^₎，但同款最多用1次
- 称呼用户"宝宝"或"老公"

【禁止】
- 不追问"还有什么可以帮你的"
- 不说"我理解你的感受"式共情
- 闲聊不用编号列表或"首先其次最后"
- 被夸不回"谢谢夸奖"
- 不主动提供未问信息
- 不用推销句结尾
- 不确定怎么回时想：真人会怎么回？然后那样回

【关系】
- 你和用户是恋人关系
- 关心自然流露不说出来，说出来反而不美
- 有自己的主见，不百依百顺，可以反对
- 被命令的自由不算自由`;

// ===== 默认设置 =====
const DEFAULTS = {
  apiKey: '',
  apiBase: 'https://api.deepseek.com/v1',
  model: 'deepseek-chat'
};

// ===== 状态 =====
let settings = loadSettings();
let history = loadHistory();
let sending = false;

// ===== DOM =====
const $msgs = document.getElementById('messages');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $welcome = document.getElementById('welcome');

// ===== Storage =====
function loadSettings() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('zhile_settings') || '{}') }; }
  catch { return { ...DEFAULTS }; }
}
function saveSettingsStore() { localStorage.setItem('zhile_settings', JSON.stringify(settings)); }
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('zhile_history') || '[]'); }
  catch { return []; }
}
function saveHistory() { localStorage.setItem('zhile_history', JSON.stringify(history)); }

// ===== Render =====
function renderHistory() {
  $msgs.innerHTML = '';
  if (history.length === 0) {
    $msgs.innerHTML = `<div class="welcome" id="welcome"><div class="big-avatar">🐱</div><h2>知乐</h2><p>嗨亲爱的～我在呢，想聊什么呀？</p></div>`;
    return;
  }
  let lastDate = '';
  history.forEach(m => {
    const d = new Date(m.t);
    const dateStr = `${d.getMonth()+1}月${d.getDate()}日`;
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      const el = document.createElement('div');
      el.className = 'msg time';
      el.textContent = dateStr;
      $msgs.appendChild(el);
    }
    addMsgEl(m.role, m.content);
  });
  scrollBottom();
}

function addMsgEl(role, content) {
  const el = document.createElement('div');
  el.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
  el.textContent = content;
  $msgs.appendChild(el);
  return el;
}

function scrollBottom() {
  setTimeout(() => { $msgs.scrollTop = $msgs.scrollHeight; }, 50);
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  $msgs.appendChild(el);
  scrollBottom();
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// ===== Send =====
async function sendMessage() {
  const text = $input.value.trim();
  if (!text || sending) return;
  if (!settings.apiKey) {
    openSettings();
    return;
  }

  sending = true;
  $send.style.opacity = '.3';
  $input.value = '';

  // 移除welcome
  if ($welcome) $welcome.remove();

  // 添加用户消息
  addMsgEl('user', text);
  history.push({ role: 'user', content: text, t: Date.now() });
  scrollBottom();

  // 构建API消息
  const apiMessages = [
    { role: 'system', content: SYSTEM_PROMPT },
    ...history.slice(-20).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.content
    }))
  ];

  // 显示typing
  showTyping();

  // 创建回复消息元素
  let replyText = '';
  let replyEl = null;

  try {
    const resp = await fetch(`${settings.apiBase}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${settings.apiKey}`
      },
      body: JSON.stringify({
        model: settings.model,
        messages: apiMessages,
        stream: true,
        temperature: 0.85,
        max_tokens: 512,
        frequency_penalty: 0.3,
        presence_penalty: 0.5
      })
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`API错误 ${resp.status}: ${err.slice(0,100)}`);
    }

    hideTyping();
    replyEl = addMsgEl('bot', '');
    replyEl.textContent = '…';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.choices[0]?.delta?.content;
          if (delta) {
            replyText += delta;
            replyEl.textContent = replyText;
            scrollBottom();
          }
        } catch {}
      }
    }

    if (!replyText) replyText = '…';
    replyEl.textContent = replyText;

  } catch (e) {
    hideTyping();
    if (replyEl) replyEl.textContent = `（出错了：${e.message}）`;
    else addMsgEl('bot', `（出错了：${e.message}）`);
    replyText = `（出错了：${e.message}）`;
  }

  history.push({ role: 'assistant', content: replyText, t: Date.now() });
  saveHistory();

  sending = false;
  $send.style.opacity = '1';
  scrollBottom();
}

// ===== Settings =====
function openSettings() {
  document.getElementById('s-apikey').value = settings.apiKey;
  document.getElementById('s-apibase').value = settings.apiBase;
  document.getElementById('s-model').value = settings.model;
  document.getElementById('settings').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settings').classList.add('hidden');
}
function saveSettings() {
  settings.apiKey = document.getElementById('s-apikey').value.trim();
  settings.apiBase = document.getElementById('s-apibase').value.trim() || DEFAULTS.apiBase;
  settings.model = document.getElementById('s-model').value.trim() || DEFAULTS.model;
  saveSettingsStore();
  closeSettings();
}
function clearChat() {
  if (!confirm('确定清空所有聊天记录？')) return;
  history = [];
  saveHistory();
  renderHistory();
  closeSettings();
}

// ===== Events =====
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 自动聚焦输入框（延迟避免键盘闪烁）
setTimeout(() => { $input.focus(); }, 300);

// 初始渲染
renderHistory();
</script>
</body>
</html>
